services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - pip-cache:/tmp/pip-cache
      - ./dev-tools:/mnt/dev-tools  # Volume para exportar ferramentas Qt6/KF6
    environment:
      - QT_QPA_PLATFORM=offscreen
      - DISPLAY=:99
      - HOME=/tmp/dev-home
      - PIP_CACHE_DIR=/tmp/pip-cache
      - PYTEST_CACHE_DIR=/tmp/pytest-cache
    command: tail -f /dev/null  # Mantém container rodando para desenvolvimento

volumes:
  pip-cache:
