[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-quick-task"
version = "1.0.0"
description = "Aplicação para criar issues no Jira com interface"
readme = "README.md"
requires-python = ">=3.11"
# Nota: PySide6 deve ser instalado via pacotes do sistema para compatibilidade
# com Kirigami 6 (KF6). Não incluir nas dependências do pip.
# Instalar com: sudo apt install python3-pyside6.qtcore python3-pyside6.qtgui python3-pyside6.qtqml
# No Flatpak, PySide6 vem do io.qt.PySide.BaseApp.
dependencies = [
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "pytz>=2023.3",
    "pyyaml>=6.0",
    "markdown>=3.5",
    "Pygments>=2.17.0",
    "google-auth>=2.25.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.100.0",
]

[project.scripts]
jira-quick-task = "src.app:main"

[tool.setuptools]
packages = ["src", "config", "core", "src.models", "src.utils", "src.services", "src.database"]

[tool.setuptools.package-data]
"src" = ["qml/*.qml", "qml/**/*.qml", "qml/**/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "/tmp/pytest-cache"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short --disable-warnings"
filterwarnings = [
    "ignore::DeprecationWarning:PySide6",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src", "core", "config"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/qml/*",
    "*/__main__.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
